<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Value pop-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A6E07A}a:hover{color:#C9F0A8}
</style>
</helmet>
<div style="width: 640px; height: 480px; overflow: hidden; background: #000000">
<div style="width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0; background: #0D1610; color: #F3ECD6; font-family: 'Barlow Semi Condensed', sans-serif; position: relative; overflow: hidden">

<div style="position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0.22">
<div style="height: 20px; border-bottom: 1px solid #21392B"></div>
<div style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 8px"><div style="width: 44px; height: 44px; border-radius: 8px; background: #A6E07A"></div><div style="font-family: Fredoka, sans-serif; font-size: 26px">Crunch Lead</div></div>
<div style="flex-grow: 1; padding: 0 6px 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px"><div style="background: #172A1F; border-radius: 8px"></div><div style="background: #172A1F; border-radius: 8px"></div><div style="background: #172A1F; border-radius: 8px"></div><div style="background: #172A1F; border-radius: 8px"></div></div>
</div>

<div style="position: absolute; left: 10px; top: 30px; width: 300px; height: 180px; box-sizing: border-box; background: #172A1F; border: 2px solid #A6E07A; border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 20px; height: 20px; border-radius: 10px; border: 2px solid #A6E07A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #A6E07A">1</span>
<span style="font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #93AC9A; flex-grow: 1">DRIVE</span>
<sc-if value="{{fine}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; font-weight: 700; color: #0D1610; background: #FFB547; border-radius: 4px; padding: 1px 6px">FINE ×10</span>
</sc-if>
</div>
<div style="display: flex; align-items: baseline; gap: 4px; justify-content: center">
<span style="font-size: 68px; font-weight: 700; line-height: 1">{{shown}}</span>
<span style="font-size: 26px; font-weight: 600; color: #93AC9A">%</span>
</div>
<sc-if value="{{coarse}}" hint-placeholder-val="{{true}}">
<div style="position: relative; height: 10px; border-radius: 5px; background: #2E4A39; margin-top: 6px">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pct}}; border-radius: 5px; background: #A6E07A"></div>
<div style="position: absolute; left: 50%; top: -4px; width: 2px; height: 18px; background: #F3ECD6"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #93AC9A"><span>0</span><span>default 50</span><span>100</span></div>
</sc-if>
<sc-if value="{{fine}}" hint-placeholder-val="{{false}}">
<div style="position: relative; height: 18px; margin-top: 2px; display: flex; justify-content: space-between; align-items: flex-end">
<sc-for list="{{ticks}}" as="k" hint-placeholder-count="21"><span style="width: 1px; height: {{k.h}}; background: #5E7D69"></span></sc-for>
<div style="position: absolute; left: 55%; top: 0; width: 3px; height: 18px; margin-left: -1px; background: #FFB547; border-radius: 2px"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #93AC9A"><span>60.0</span><span>steps of 0.1</span><span>64.0</span></div>
</sc-if>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fine":{"editor":"boolean","default":false},"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const fine = this.props.fine ?? false;
    const ticks = [];
    for (let i = 0; i <= 20; i++) ticks.push({ h: (i % 5 === 0 ? 14 : 7) + 'px' });
    return { fine, coarse: !fine, shown: fine ? '62.2' : '62', pct: '62%', ticks };
  }
}
</script>
</body>
</html>
