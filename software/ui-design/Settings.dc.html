<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A6E07A}a:hover{color:#C9F0A8}
</style>
</helmet>
<div style="width: 640px; height: 480px; overflow: hidden; background: #000000">
<div style="width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0; background: #0D1610; color: #F3ECD6; font-family: 'Barlow Semi Condensed', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 24px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #21392B">
<span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 16px">Settings</span>
<span style="font-size: 12px; font-weight: 600; color: #93AC9A">5 / 9</span>
</div>

<div style="flex-grow: 1; padding: 4px 6px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="height: 25px; flex-shrink: 0; border-radius: 6px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; background: {{r.bg}}; color: {{r.fg}}; font-size: 15px; font-weight: 600">
<span>{{r.k}}</span><span style="font-weight: 700">{{r.v}}</span>
</div>
</sc-for>
</div>

<div style="height: 22px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: #93AC9A; border-top: 1px solid #21392B">
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid #93AC9A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px">1</span>move · back</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid #A6E07A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #A6E07A">4</span>turn: change</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const n = { bg: 'transparent', fg: '#F3ECD6' };
    return {
      rows: [
        { ...n, k: 'Input mode', v: 'Auto · stereo' },
        { ...n, k: 'Output', v: 'Stereo' },
        { ...n, k: 'MIDI channel', v: '1' },
        { ...n, k: 'MIDI thru', v: 'Soft' },
        { bg: '#A6E07A', fg: '#0D1610', k: 'Footswitch hold', v: '◂ Next preset ▸' },
        { ...n, k: 'Buffer', v: '128 · 5.3 ms' },
        { ...n, k: 'Brightness', v: '80 %' }
      ]
    };
  }
}
</script>
</body>
</html>
