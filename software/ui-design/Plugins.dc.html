<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plugin browser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A6E07A}a:hover{color:#C9F0A8}
</style>
</helmet>
<div style="width: 640px; height: 480px; overflow: hidden; background: #000000">
<div style="width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0; background: #0D1610; color: #F3ECD6; font-family: 'Barlow Semi Condensed', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 24px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #21392B">
<span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 16px">Plugins</span>
<span style="font-size: 12px; font-weight: 600; color: #93AC9A">2 installed</span>
</div>

<div style="flex-grow: 1; padding: 6px; display: flex; flex-direction: column; gap: 4px">

<div style="height: 46px; border-radius: 6px; padding: 0 10px; display: flex; align-items: center; gap: 8px; background: #172A1F">
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-family: Fredoka, sans-serif; font-weight: 500; font-size: 18px">Melon GraphicEQ</span>
<span style="font-size: 12px; font-weight: 600; color: #93AC9A">EQ · stereo 2→2 · 31 bands + output</span>
</div>
<span style="font-size: 11px; font-weight: 700; color: #A6E07A; border: 1.5px solid #A6E07A; border-radius: 4px; padding: 0 4px">LOADED</span>
</div>

<div style="height: 46px; border-radius: 6px; padding: 0 10px; display: flex; align-items: center; gap: 8px; background: #A6E07A; color: #0D1610">
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 18px">Melon Drive</span>
<span style="font-size: 12px; font-weight: 600; color: #24412F">Distortion · mono 1→1 · 4 controls</span>
</div>
</div>

<div style="height: 46px; border-radius: 6px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border: 1.5px dashed #2E4A39; color: #93AC9A">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#93AC9A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
<span style="font-size: 13px; font-weight: 600">Add plugins from a phone at melon.local</span>
</div>

</div>

<div style="height: 22px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: #93AC9A; border-top: 1px solid #21392B">
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid #93AC9A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px">1</span>move · back</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid #A6E07A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #A6E07A">4</span>push: load</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
