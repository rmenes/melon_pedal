<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A6E07A}a:hover{color:#C9F0A8}
</style>
</helmet>
<div style="width: 640px; height: 480px; overflow: hidden; background: #000000">
<div style="width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0; background: #0D1610; color: #F3ECD6; font-family: 'Barlow Semi Condensed', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 20px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: #93AC9A; border-bottom: 1px solid #21392B">
<span style="letter-spacing: 0.04em">BANK 1</span>
<span style="display: flex; gap: 4px; align-items: center" aria-label="page 1 of 2"><span style="width: 6px; height: 6px; border-radius: 3px; background: #F3ECD6"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #3E5C49"></span></span>
<span style="display: flex; gap: 8px; align-items: center">
<span style="display: flex; align-items: center; gap: 3px"><span style="width: 5px; height: 5px; border-radius: 3px; background: #A6E07A"></span>MIDI</span>
<svg width="14" height="11" viewBox="0 0 14 11" fill="none" stroke="#93AC9A" stroke-width="1.6" stroke-linecap="round" role="img" aria-label="Wi-Fi connected"><path d="M1 4a9 9 0 0 1 12 0"></path><path d="M3.5 6.5a5.5 5.5 0 0 1 7 0"></path><path d="M6 9a2 2 0 0 1 2 0"></path></svg>
<span>CPU 18%</span>
</span>
</div>

<div style="height: 56px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; gap: 8px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px; background: {{accent}}; color: #0D1610; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px; display: flex; align-items: center; justify-content: center">03</div>
<div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
<div style="font-family: Fredoka, sans-serif; font-weight: 500; font-size: 26px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Crunch Lead</div>
<div style="font-size: 13px; font-weight: 500; color: #93AC9A">Melon Drive · page 1/2</div>
</div>
<span style="align-self: flex-start; margin-top: 8px; font-size: 11px; font-weight: 700; color: #0D1610; background: #FFB547; border-radius: 4px; padding: 1px 4px">EDITED</span>
</div>

<div style="flex-grow: 1; padding: 0 6px 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="background: #172A1F; border-radius: 8px; padding: 0 8px; display: flex; align-items: center; gap: 8px; min-width: 0">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="flex-shrink: 0">
<circle cx="20" cy="20" r="16" fill="none" stroke="#2E4A39" stroke-width="4" stroke-linecap="round" stroke-dasharray="75.4 100.5" transform="rotate(135 20 20)"></circle>
<sc-if value="{{t.isArc}}" hint-placeholder-val="{{true}}">
<circle cx="20" cy="20" r="16" fill="none" stroke="{{t.arcColor}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="{{t.dash}}" transform="rotate(135 20 20)"></circle>
</sc-if>
<sc-if value="{{t.isEnum}}" hint-placeholder-val="{{false}}">
<circle cx="8.7" cy="31.3" r="3" fill="#3E5C49"></circle><circle cx="20" cy="4" r="3.5" fill="{{t.arcColor}}"></circle><circle cx="31.3" cy="31.3" r="3" fill="#3E5C49"></circle>
</sc-if>
<text x="20" y="24.5" text-anchor="middle" font-size="13" font-weight="700" fill="#93AC9A" font-family="Barlow Semi Condensed, sans-serif">{{t.num}}</text>
</svg>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #93AC9A">{{t.label}}</span>
<span style="font-size: 24px; font-weight: 600; line-height: 1.1; white-space: nowrap">{{t.value}}<span style="font-size: 13px; font-weight: 500; color: #93AC9A; margin-left: 2px">{{t.unit}}</span></span>
</div>
</div>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A6E07A","options":["#A6E07A","#7FD4C1","#FFB547"]},"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#A6E07A';
    const L = 75.4;
    const arc = (v) => (L * v).toFixed(1) + ' 100.5';
    return {
      accent,
      tiles: [
        { num: '1', label: 'DRIVE', value: '62', unit: '%', isArc: true, isEnum: false, dash: arc(0.62), arcColor: accent },
        { num: '2', label: 'TONE', value: '4.8', unit: 'kHz', isArc: true, isEnum: false, dash: arc(0.81), arcColor: accent },
        { num: '3', label: 'LEVEL', value: '−3.0', unit: 'dB', isArc: true, isEnum: false, dash: arc(0.58), arcColor: accent },
        { num: '4', label: 'MODE', value: 'Asym', unit: '2/3', isArc: false, isEnum: true, dash: '0 100.5', arcColor: accent }
      ]
    };
  }
}
</script>
</body>
</html>
