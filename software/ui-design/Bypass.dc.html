<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play screen, bypassed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A6E07A}a:hover{color:#C9F0A8}
</style>
</helmet>
<div style="width: 640px; height: 480px; overflow: hidden; background: #000000">
<div style="width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0; background: #0D1610; color: #F3ECD6; font-family: 'Barlow Semi Condensed', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 26px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #C8262B; color: #FFFFFF; font-size: 18px; font-weight: 700; letter-spacing: 0.18em">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8h12"></path><path d="M5 4h6"></path><path d="M5 12h6"></path></svg>
BYPASS
</div>

<div style="height: 52px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; gap: 8px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px; background: #2E4A39; color: #F3ECD6; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 24px; display: flex; align-items: center; justify-content: center">03</div>
<div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
<div style="font-family: Fredoka, sans-serif; font-weight: 500; font-size: 26px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Crunch Lead</div>
<div style="font-size: 13px; font-weight: 500; color: #93AC9A">Dry signal · relays in true bypass</div>
</div>
</div>

<div style="flex-grow: 1; padding: 0 6px 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px; opacity: 0.45">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="background: #172A1F; border-radius: 8px; padding: 0 8px; display: flex; align-items: center; gap: 8px; min-width: 0">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="flex-shrink: 0">
<circle cx="20" cy="20" r="16" fill="none" stroke="#2E4A39" stroke-width="4" stroke-linecap="round" stroke-dasharray="75.4 100.5" transform="rotate(135 20 20)"></circle>
<circle cx="20" cy="20" r="16" fill="none" stroke="#93AC9A" stroke-width="4" stroke-linecap="round" stroke-dasharray="{{t.dash}}" transform="rotate(135 20 20)"></circle>
<text x="20" y="24.5" text-anchor="middle" font-size="13" font-weight="700" fill="#93AC9A" font-family="Barlow Semi Condensed, sans-serif">{{t.num}}</text>
</svg>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; color: #93AC9A">{{t.label}}</span>
<span style="font-size: 24px; font-weight: 600; line-height: 1.1; white-space: nowrap">{{t.value}}<span style="font-size: 13px; font-weight: 500; color: #93AC9A; margin-left: 2px">{{t.unit}}</span></span>
</div>
</div>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const arc = (v) => (75.4 * v).toFixed(1) + ' 100.5';
    return {
      tiles: [
        { num: '1', label: 'DRIVE', value: '62', unit: '%', dash: arc(0.62) },
        { num: '2', label: 'TONE', value: '4.8', unit: 'kHz', dash: arc(0.81) },
        { num: '3', label: 'LEVEL', value: '−3.0', unit: 'dB', dash: arc(0.58) },
        { num: '4', label: 'MODE', value: 'Asym', unit: '2/3', dash: arc(0.5) }
      ]
    };
  }
}
</script>
</body>
</html>
