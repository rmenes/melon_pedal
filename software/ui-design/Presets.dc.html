<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preset browser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A6E07A}a:hover{color:#C9F0A8}
</style>
</helmet>
<div style="width: 640px; height: 480px; overflow: hidden; background: #000000">
<div style="width: 320px; height: 240px; transform: scale(2); transform-origin: 0 0; background: #0D1610; color: #F3ECD6; font-family: 'Barlow Semi Condensed', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 24px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #21392B">
<span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 16px">Presets</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700"><span style="color: #93AC9A">◂</span>BANK 1 of 4<span style="color: #93AC9A">▸</span></span>
</div>

<div style="flex-grow: 1; display: flex; padding: 4px 4px 4px 6px; gap: 4px; min-height: 0">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="height: 29px; flex-shrink: 0; border-radius: 6px; padding: 0 8px; display: flex; align-items: center; gap: 8px; background: {{r.bg}}; color: {{r.fg}}">
<span style="width: 20px; font-size: 15px; font-weight: 700; opacity: 0.8">{{r.n}}</span>
<span style="flex-grow: 1; font-family: Fredoka, sans-serif; font-weight: 500; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: {{r.op}}">{{r.name}}</span>
<span style="font-size: 12px; font-weight: 600; opacity: 0.8">{{r.plugin}}</span>
<span style="width: 10px; font-size: 11px">{{r.mark}}</span>
</div>
</sc-for>
</div>
<div style="width: 3px; border-radius: 2px; background: #21392B; position: relative"><div style="position: absolute; left: 0; right: 0; top: 0; height: 60%; border-radius: 2px; background: #5E7D69"></div></div>
</div>

<div style="height: 22px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: #93AC9A; border-top: 1px solid #21392B">
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid #93AC9A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px">1</span>move · back</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid #93AC9A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px">2</span>bank</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid #A6E07A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #A6E07A">4</span>push: load</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { bg: 'transparent', fg: '#F3ECD6', op: 1, mark: '' };
    return {
      rows: [
        { ...base, n: '01', name: 'Clean Sparkle', plugin: 'GraphicEQ' },
        { ...base, n: '02', name: 'Mid Push', plugin: 'GraphicEQ' },
        { ...base, n: '03', name: 'Crunch Lead', plugin: 'Drive', mark: '▶' },
        { ...base, n: '04', name: 'Fat Rhythm', plugin: 'Drive', bg: '#A6E07A', fg: '#0D1610' },
        { ...base, n: '05', name: '— empty —', plugin: '', op: 0.5 },
        { ...base, n: '06', name: '— empty —', plugin: '', op: 0.5 }
      ]
    };
  }
}
</script>
</body>
</html>
